[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proteus2py"
version = "0.1.0"
description = "Script Proteus 8 from Python and AI assistants: headless ProSPICE simulation (SPICE decks, OP/AC/transient/DC/noise), Proteus's own graphs and screenshots, MCP server. Linux (sandboxed Wine)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DontforgetAntaiku" }]
keywords = ["proteus", "proteus-8", "isis", "prospice", "spice", "circuit-simulation", "electronics", "mcp", "wine", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Education",
]
dependencies = ["mcp>=2.3", "pillow>=10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
fast = ["numpy"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8", "numpy"]

[project.scripts]
proteus2py = "proteus2py.cli:main"
proteus2py-mcp = "proteus2py.server:main"

[project.urls]
Homepage = "https://github.com/DontforgetAntaiku/proteus2py"
Issues = "https://github.com/DontforgetAntaiku/proteus2py/issues"
Changelog = "https://github.com/DontforgetAntaiku/proteus2py/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/proteus2py"]
artifacts = ["src/proteus2py/_native/*"]

[tool.hatch.build.targets.sdist]
include = ["src/proteus2py", "native/hook.c", "native/launch.c", "native/Makefile", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["wine: needs the Wine sandbox (PROTEUS_INTEGRATION=1)"]

[tool.ruff]
line-length = 190
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN"]
ignore = ["E701", "E702", "E731", "B905", "UP031", "B023", "B007", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"src/proteus2py/_gen/cdbfmt.py" = ["E", "F", "W", "I", "B", "UP", "ANN"]          # ported research parsers, round-trip tested
"src/proteus2py/_gen/pdsfmt.py" = ["E", "F", "W", "I", "B", "UP", "ANN"]
"tests/*" = ["E402", "ANN"]
